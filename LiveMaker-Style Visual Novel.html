<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visual Novel</title>
  <style>
    /* =========================================================
       GLOBAL RESET & PERFORMANCE DEFAULTS
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background: #0a0b0e;
      color: #e0e0e0;
      font-family: "MS Gothic", "Hiragino Kaku Gothic Pro", monospace, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 4:3 Screen Container */
    #vn-screen {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 2px solid #2e3546;
      overflow: hidden;
      contain: layout paint;
    }

    /* =========================================================
       CUSTOMIZE DIALOGUE BOX
       ========================================================= */
    #textbox-container {
      position: absolute;
      bottom: 10px;
      left: 12px;
      right: 12px;
      cursor: pointer;
      z-index: 10;
    }

    #name-box {
      display: inline-block;
      background: #141f33;
      color: #ffffff;
      border: 1.5px solid #5a769e;
      border-bottom: none;
      padding: 2px 14px;
      font-size: 13px;
      font-weight: bold;
    }

    #dialogue-box {
      background: rgba(10, 16, 28, 0.94);
      border: 1.5px solid #5a769e;
      padding: 10px 14px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #dialogue-text {
      color: #f0f3f8;
      font-size: 14.5px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    #dialogue-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid #1c2738;
    }

    .quick-btn {
      background: none;
      border: none;
      color: #7b8ea8;
      font-size: 11px;
      cursor: pointer;
      margin-right: 8px;
    }

    .quick-btn:hover {
      color: #ffffff;
    }

    #caret {
      color: #72a4e8;
      font-size: 11px;
      animation: blink 0.6s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    /* =========================================================
       LAYERS (BACKGROUND & SPRITES)
       ========================================================= */
    #bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      will-change: background-image;
    }

    #stage-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .character-slot {
      position: absolute;
      bottom: 0;
      width: 270px;
      height: 460px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      will-change: opacity, transform;
    }

    .character-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .pos-left { left: 5%; }
    .pos-center { left: 50%; transform: translateX(-50%); }
    .pos-right { right: 5%; }

    /* =========================================================
       SCREENS (TITLE & END)
       ========================================================= */
    .overlay-screen {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
    }

    #title-screen {
      background-color: #0c111a;
    }

    .game-title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #e5edf8;
      margin-bottom: 24px;
    }

    .title-menu-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 190px;
    }

    .title-btn {
      padding: 9px;
      background: #141d2b;
      border: 1.5px solid #4a668a;
      color: #c8d8ea;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .title-btn:hover {
      background: #24354f;
      border-color: #84aee6;
      color: #fff;
    }

    #end-screen {
      background-color: #06080c;
      cursor: pointer;
    }

    .the-end-text {
      font-size: 30px;
      letter-spacing: 4px;
      color: #d6e2f0;
      margin-bottom: 8px;
    }

    .end-subtext {
      font-size: 11px;
      color: #64758d;
    }

    /* Choices Overlay */
    #choice-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }

    .choice-btn {
      width: 75%;
      max-width: 440px;
      padding: 11px 14px;
      background: #142033;
      border: 1.5px solid #4b6b96;
      color: #ffffff;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
    }

    .choice-btn:hover {
      background: #233654;
      border-color: #8bb3ed;
    }

    /* Menu Button */
    #menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      background: rgba(20, 31, 48, 0.85);
      border: 1px solid #5a769e;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      z-index: 30;
    }

    #menu-btn span {
      display: block;
      width: 15px;
      height: 2px;
      background: #c3d3ea;
    }

    /* System Drawer */
    #system-panel {
      position: absolute;
      top: 45px;
      right: 10px;
      width: 180px;
      background: #131b29;
      border: 1.5px solid #5a769e;
      z-index: 35;
      display: flex;
      flex-direction: column;
    }

    .menu-item {
      background: none;
      border: none;
      border-bottom: 1px solid #202d42;
      color: #c3d3ea;
      padding: 9px 12px;
      text-align: left;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .menu-item:hover {
      background: #22344f;
      color: #ffffff;
    }

    /* Backlog Window */
    #log-window {
      position: absolute;
      inset: 10px;
      background: #0d131d;
      border: 1.5px solid #5a769e;
      z-index: 40;
      display: flex;
      flex-direction: column;
    }

    #log-header {
      padding: 7px 10px;
      background: #152236;
      border-bottom: 1px solid #5a769e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    #log-body {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }

    .log-entry {
      margin-bottom: 8px;
      border-bottom: 1px solid #1a273b;
      padding-bottom: 5px;
    }

    .log-speaker {
      color: #72a4e8;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="vn-screen">
    <!-- Title Screen -->
    <div id="title-screen" class="overlay-screen">
      <div class="game-title">Japan's Home</div>
      <div class="title-menu-group">
        <button class="title-btn" id="btn-start-game">START STORY</button>
      </div>
    </div>

    <!-- The End Screen -->
    <div id="end-screen" class="overlay-screen hidden">
      <div class="the-end-text">THE END</div>
      <div class="end-subtext">Click or tap to return to title</div>
    </div>

    <!-- Hamburger Menu Button -->
    <button id="menu-btn" title="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- In-Game Menu -->
    <div id="system-panel" class="hidden">
      <button class="menu-item" id="btn-speed-toggle">Text Speed: <span id="speed-label" style="color:#72a4e8;">Fast</span></button>
      <button class="menu-item" id="btn-backlog">Backlog</button>
      <button class="menu-item" id="btn-restart">Title Screen</button>
      <button class="menu-item" id="btn-close-menu">Close</button>
    </div>

    <!-- Backlog Window -->
    <div id="log-window" class="hidden">
      <div id="log-header">
        <span>Dialogue History</span>
        <button id="btn-log-close" style="background:none; border:none; color:#fff; cursor:pointer;">[X]</button>
      </div>
      <div id="log-body"></div>
    </div>

    <!-- Background Layer -->
    <div id="bg-layer"></div>

    <!-- Sprites Stage Layer -->
    <div id="stage-layer">
      <div id="slot-1" class="character-slot"></div>
      <div id="slot-2" class="character-slot"></div>
    </div>

    <!-- Choices -->
    <div id="choice-overlay" class="hidden"></div>

    <!-- Dialogue Box Container -->
    <div id="textbox-container">
      <div id="name-box">Name</div>
      <div id="dialogue-box">
        <div id="dialogue-text">...</div>
        <div id="dialogue-footer">
          <div>
            <button class="quick-btn" id="btn-auto">Auto: Off</button>
            <button class="quick-btn" id="btn-skip">Skip</button>
          </div>
          <div id="caret">▼</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. ASSETS
       ========================================================= */
    const backgrounds = {
      title: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='800' height='600' fill='%230e1522'/></svg>",
      rooftop: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='800' height='600' fill='%237d3d2c'/><circle cx='200' cy='320' r='85' fill='%23f39c12'/><polygon points='0,460 800,460 800,600 0,600' fill='%232c3e50'/></svg>",
      night: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='800' height='600' fill='%23080b11'/><circle cx='650' cy='120' r='35' fill='%23f1f2f6'/></svg>"
    };

    const aoiSprites = {
      normal: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='270' height='460'><rect x='75' y='210' width='120' height='250' fill='%23213a52'/><circle cx='135' cy='145' r='48' fill='%23f9d5bb'/><ellipse cx='120' cy='140' rx='4' ry='6' fill='%23111'/><ellipse cx='150' cy='140' rx='4' ry='6' fill='%23111'/><path d='M130,165 Q135,170 140,165' stroke='%23333' stroke-width='2' fill='none'/><path d='M85,125 Q135,95 185,125' stroke='%234a2e1b' stroke-width='14' fill='none'/></svg>",
      smile: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='270' height='460'><rect x='75' y='210' width='120' height='250' fill='%23213a52'/><circle cx='135' cy='145' r='48' fill='%23f9d5bb'/><path d='M115,140 Q120,135 125,140' stroke='%23111' stroke-width='3' fill='none'/><path d='M145,140 Q150,135 155,140' stroke='%23111' stroke-width='3' fill='none'/><path d='M128,162 Q135,174 142,162 Z' fill='%23c0392b'/><circle cx='110' cy='152' r='6' fill='%23e74c3c' opacity='0.5'/><circle cx='160' cy='152' r='6' fill='%23e74c3c' opacity='0.5'/><path d='M85,125 Q135,95 185,125' stroke='%234a2e1b' stroke-width='14' fill='none'/></svg>",
      embarrassed: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='270' height='460'><rect x='75' y='210' width='120' height='250' fill='%23213a52'/><circle cx='135' cy='145' r='48' fill='%23f9d5bb'/><ellipse cx='120' cy='140' rx='4' ry='6' fill='%23111'/><ellipse cx='150' cy='140' rx='4' ry='6' fill='%23111'/><circle cx='110' cy='152' r='9' fill='%23e74c3c' opacity='0.6'/><circle cx='160' cy='152' r='9' fill='%23e74c3c' opacity='0.6'/><path d='M85,125 Q135,95 185,125' stroke='%234a2e1b' stroke-width='14' fill='none'/></svg>"
    };

    const renSprites = {
      normal: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='270' height='460'><rect x='75' y='200' width='120' height='260' fill='%232c3e50'/><circle cx='135' cy='140' r='46' fill='%23f5cba7'/><line x1='115' y1='138' x2='125' y2='138' stroke='%23111' stroke-width='3'/><line x1='145' y1='138' x2='155' y2='138' stroke='%23111' stroke-width='3'/><path d='M85,115 L135,90 L185,115' stroke='%231b2631' stroke-width='15' fill='none'/></svg>"
    };

    /* =========================================================
       2. SCENARIO SCRIPT
       ========================================================= */
    const script = [
      {
        bg: "rooftop",
        speaker: "",
        text: "The sun was sinking behind the skyline, casting an orange haze over the school rooftop."
      },
      {
        speaker: "Japan",
        sprite1: { character: "aoi", expr: "normal", pos: "center" },
        text: "You're still here, Italy? Wasn't Germany looking for you?"
      },
      {
        speaker: "??",
        text: "I'm not him!"
      },
      {
        speaker: "Aoi",
        sprite1: { character: "aoi", expr: "smile", pos: "center" },
        text: "Well... I was hoping I'd run into you before heading down."
      },
      {
        type: "choice",
        choices: [
          { text: "Ask what she wanted to talk about", target: "ask_reason" },
          { text: "Offer to walk down together", target: "walk_together" }
        ]
      },

      // Branch 1
      {
        label: "ask_reason",
        speaker: "Makoto",
        text: "Is this about the clubroom key again?"
      },
      {
        speaker: "Aoi",
        sprite1: { character: "aoi", expr: "embarrassed", pos: "left" },
        sprite2: { character: "ren", expr: "normal", pos: "right" },
        text: "N-No! Well, yes! Ren was looking everywhere for it!"
      },
      {
        speaker: "Ren",
        text: "Makoto, please. You took it with you during lunch hour."
      },
      {
        jump: "scene_end"
      },

      // Branch 2
      {
        label: "walk_together",
        speaker: "Makoto",
        text: "If you're heading toward the station, want to walk together?"
      },
      {
        speaker: "Aoi",
        sprite1: { character: "aoi", expr: "smile", pos: "center" },
        text: "Yeah. I'd like that. Let's go before it gets completely dark."
      },
      {
        jump: "scene_end"
      },

      // Conclusion & End
      {
        label: "scene_end",
        bg: "night",
        sprite1: null,
        sprite2: null,
        speaker: "",
        text: "The evening chimes echoed down the street as the lights of the town began to turn on."
      },
      {
        type: "end",
        bg: "night"
      }
    ];

    /* =========================================================
       3. FAST & SMOOTH ENGINE CORE
       ========================================================= */

    // Text Speed Presets (ms delay per character)
    const SPEED_PRESETS = [
      { label: "Fast", delay: 7 },       // Smooth & fast (7ms)
      { label: "Instant", delay: 0 },    // Immediate display (0ms)
      { label: "Normal", delay: 20 }     // 60fps standard (20ms)
    ];
    let speedIndex = 0; // default to Normal

    let currentStep = 0;
    let isTyping = false;
    let textToDisplay = "";
    let animationFrameId = null;
    let autoPlay = false;
    let autoTimer = null;
    let historyLog = [];

    // DOM References
    const titleScreen = document.getElementById("title-screen");
    const endScreen = document.getElementById("end-screen");
    const bgLayer = document.getElementById("bg-layer");
    const slot1 = document.getElementById("slot-1");
    const slot2 = document.getElementById("slot-2");
    const nameBox = document.getElementById("name-box");
    const dialogueBox = document.getElementById("dialogue-box");
    const dialogueText = document.getElementById("dialogue-text");
    const textboxContainer = document.getElementById("textbox-container");
    const choiceOverlay = document.getElementById("choice-overlay");
    const menuBtn = document.getElementById("menu-btn");
    const systemPanel = document.getElementById("system-panel");
    const logWindow = document.getElementById("log-window");
    const logBody = document.getElementById("log-body");
    const btnAuto = document.getElementById("btn-auto");
    const btnSkip = document.getElementById("btn-skip");
    const btnStartGame = document.getElementById("btn-start-game");
    const btnSpeedToggle = document.getElementById("btn-speed-toggle");
    const speedLabel = document.getElementById("speed-label");

    function init() {
      titleScreen.style.backgroundImage = `url("${backgrounds.title}")`;
      bindEvents();
    }

    function startGame() {
      titleScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      textboxContainer.classList.remove("hidden");
      menuBtn.classList.remove("hidden");
      historyLog = [];
      runStep(0);
    }

    function returnToTitle() {
      cancelAnimationFrame(animationFrameId);
      clearTimeout(autoTimer);
      autoPlay = false;
      btnAuto.textContent = "Auto: Off";
      btnAuto.style.color = "#7b8ea8";

      endScreen.classList.add("hidden");
      systemPanel.classList.add("hidden");
      logWindow.classList.add("hidden");
      choiceOverlay.classList.add("hidden");
      textboxContainer.classList.add("hidden");
      menuBtn.classList.add("hidden");

      slot1.innerHTML = "";
      slot2.innerHTML = "";
      titleScreen.classList.remove("hidden");
    }

    function getSpriteSrc(character, expression) {
      if (character === "aoi") return aoiSprites[expression] || aoiSprites.normal;
      if (character === "ren") return renSprites[expression] || renSprites.normal;
      return "";
    }

    function positionSlot(element, pos) {
      element.className = "character-slot";
      element.style.left = "";
      element.style.right = "";
      element.style.transform = "";

      if (!pos) return;
      if (typeof pos === "string") {
        if (pos === "left") element.classList.add("pos-left");
        else if (pos === "center") element.classList.add("pos-center");
        else if (pos === "right") element.classList.add("pos-right");
      } else if (typeof pos === "object") {
        if (pos.x !== undefined) element.style.left = pos.x + "%";
        if (pos.y !== undefined) element.style.bottom = pos.y + "px";
      }
    }

    function updateCharacter(slotElement, spriteData) {
      if (!spriteData) {
        slotElement.innerHTML = "";
        return;
      }
      positionSlot(slotElement, spriteData.pos);
      const src = getSpriteSrc(spriteData.character, spriteData.expr);
      slotElement.innerHTML = `<img src="${src}" alt="${spriteData.character}">`;
    }

    function runStep(index) {
      if (index < 0 || index >= script.length) return;
      currentStep = index;
      const data = script[index];

      // Jumps
      if (data.jump) {
        const targetIndex = script.findIndex(item => item.label === data.jump);
        if (targetIndex !== -1) {
          runStep(targetIndex);
          return;
        }
      }

      // End
      if (data.type === "end") {
        textboxContainer.classList.add("hidden");
        choiceOverlay.classList.add("hidden");
        menuBtn.classList.add("hidden");
        if (data.bg && backgrounds[data.bg]) {
          endScreen.style.backgroundImage = `url("${backgrounds[data.bg]}")`;
        }
        endScreen.classList.remove("hidden");
        return;
      }

      // Choice
      if (data.type === "choice") {
        renderChoices(data.choices);
        return;
      }

      choiceOverlay.classList.add("hidden");
      textboxContainer.classList.remove("hidden");

      if (data.bg && backgrounds[data.bg]) {
        bgLayer.style.backgroundImage = `url("${backgrounds[data.bg]}")`;
      }

      if (data.sprite1 !== undefined) updateCharacter(slot1, data.sprite1);
      if (data.sprite2 !== undefined) updateCharacter(slot2, data.sprite2);

      if (data.speaker && data.speaker.trim() !== "") {
        nameBox.classList.remove("hidden");
        nameBox.textContent = data.speaker;
      } else {
        nameBox.classList.add("hidden");
      }

      historyLog.push({ speaker: data.speaker || "Narrator", text: data.text });
      renderLog();

      startTypewriter(data.text);
    }

    /* =========================================================
       HIGH-PERFORMANCE TEXT STREAMER (requestAnimationFrame)
       ========================================================= */
    function startTypewriter(text) {
      cancelAnimationFrame(animationFrameId);
      clearTimeout(autoTimer);
      isTyping = true;
      textToDisplay = text;

      const currentDelay = SPEED_PRESETS[speedIndex].delay;

      // Instant mode: No waiting at all
      if (currentDelay === 0) {
        finishTypewriter();
        return;
      }

      dialogueText.textContent = "";
      let charIndex = 0;
      let lastTime = performance.now();

      function step(now) {
        const delta = now - lastTime;

        if (delta >= currentDelay) {
          // Calculate how many characters to render for high refresh displays
          const charsToAdd = Math.max(1, Math.floor(delta / currentDelay));
          charIndex = Math.min(text.length, charIndex + charsToAdd);
          dialogueText.textContent = text.slice(0, charIndex);
          lastTime = now;
        }

        if (charIndex < text.length) {
          animationFrameId = requestAnimationFrame(step);
        } else {
          finishTypewriter();
        }
      }

      animationFrameId = requestAnimationFrame(step);
    }

    function finishTypewriter() {
      cancelAnimationFrame(animationFrameId);
      dialogueText.textContent = textToDisplay;
      isTyping = false;

      if (autoPlay) {
        // Shorter delay before advancing in auto mode
        const delay = Math.max(1000, textToDisplay.length * 25);
        autoTimer = setTimeout(advance, delay);
      }
    }

    function advance() {
      if (isTyping) {
        // First click instantly shows the full text
        finishTypewriter();
        return;
      }

      if (script[currentStep].type === "choice" || script[currentStep].type === "end") return;

      if (currentStep + 1 < script.length) {
        runStep(currentStep + 1);
      }
    }

    function renderChoices(choices) {
      choiceOverlay.innerHTML = "";
      choices.forEach(c => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = "> " + c.text;
        btn.onclick = () => {
          const targetIndex = script.findIndex(item => item.label === c.target);
          if (targetIndex !== -1) {
            choiceOverlay.classList.add("hidden");
            runStep(targetIndex);
          }
        };
        choiceOverlay.appendChild(btn);
      });
      choiceOverlay.classList.remove("hidden");
    }

    function renderLog() {
      logBody.innerHTML = "";
      historyLog.forEach(entry => {
        const row = document.createElement("div");
        row.className = "log-entry";
        row.innerHTML = `<div class="log-speaker">${entry.speaker}</div><div>${entry.text}</div>`;
        logBody.appendChild(row);
      });
      logBody.scrollTop = logBody.scrollHeight;
    }

    function bindEvents() {
      btnStartGame.onclick = (e) => {
        e.stopPropagation();
        startGame();
      };

      endScreen.onclick = (e) => {
        e.stopPropagation();
        returnToTitle();
      };

      textboxContainer.onclick = (e) => {
        e.stopPropagation();
        advance();
      };

      document.getElementById("vn-screen").onclick = (e) => {
        if (!titleScreen.classList.contains("hidden")) return;
        if (!endScreen.classList.contains("hidden")) return;
        if (!choiceOverlay.classList.contains("hidden")) return;
        if (!systemPanel.classList.contains("hidden")) return;
        if (!logWindow.classList.contains("hidden")) return;
        advance();
      };

      window.onkeydown = (e) => {
        if (titleScreen.classList.contains("hidden") && endScreen.classList.contains("hidden")) {
          if (e.code === "Space" || e.code === "Enter") {
            advance();
          }
        }
      };

      // Speed Toggle
      btnSpeedToggle.onclick = (e) => {
        e.stopPropagation();
        speedIndex = (speedIndex + 1) % SPEED_PRESETS.length;
        speedLabel.textContent = SPEED_PRESETS[speedIndex].label;
      };

      btnAuto.onclick = (e) => {
        e.stopPropagation();
        autoPlay = !autoPlay;
        btnAuto.textContent = autoPlay ? "Auto: On" : "Auto: Off";
        btnAuto.style.color = autoPlay ? "#72a4e8" : "#7b8ea8";
        if (autoPlay && !isTyping) advance();
      };

      btnSkip.onclick = (e) => {
        e.stopPropagation();
        if (script[currentStep].type === "choice" || script[currentStep].type === "end") return;
        if (currentStep + 1 < script.length) {
          runStep(currentStep + 1);
        }
      };

      menuBtn.onclick = (e) => {
        e.stopPropagation();
        systemPanel.classList.toggle("hidden");
      };

      document.getElementById("btn-close-menu").onclick = (e) => {
        e.stopPropagation();
        systemPanel.classList.add("hidden");
      };

      document.getElementById("btn-backlog").onclick = (e) => {
        e.stopPropagation();
        systemPanel.classList.add("hidden");
        logWindow.classList.remove("hidden");
      };

      document.getElementById("btn-log-close").onclick = (e) => {
        e.stopPropagation();
        logWindow.classList.add("hidden");
      };

      document.getElementById("btn-restart").onclick = (e) => {
        e.stopPropagation();
        returnToTitle();
      };
    }

    window.onload = init;
  </script>
</body>
</html>
